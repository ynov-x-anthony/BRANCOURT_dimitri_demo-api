services:
  db:
    image: postgres:16-alpine
    container_name: demo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - back
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: demo-api:1.0
    container_name: demo-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:3000"
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
    secrets:
      - db_password
    # Charge le secret dans PGPASSWORD avant de lancer le serveur Node en exec
    command: sh -c 'export PGPASSWORD=$$(cat /run/secrets/db_password) && exec node server.js'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - front
      - back

  adminer:
    image: adminer:4
    container_name: demo-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - back

volumes:
  pgdata:

networks:
  front:
  back:

secrets:
  db_password:
    file: ./secrets/db_password.txt