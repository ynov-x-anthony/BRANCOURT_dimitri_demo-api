name: CI Security Scan

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build local image for scan
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile.multi
          load: true
          tags: demo-api:ci

      - name: Run Trivy vulnerability scanner via Docker
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            demo-api:ci
